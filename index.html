<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NicolasMundo - Pinguim Remake</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background-color: #2c3e50; color: white; overflow: hidden; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #1a252f; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
        .spinner { border: 4px solid rgba(255,255,255,0.1); border-left-color: #3498db; width: 60px; height: 60px; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        #percentage { font-size: 32px; font-weight: bold; color: #3498db; font-family: monospace; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #game-container { display: none; width: 100vw; height: 100vh; position: relative; background: radial-gradient(circle, #74b9ff, #0984e3); }
        #ice-world { width: 100%; height: 100%; position: relative; }
        #penguin { position: absolute; font-size: 50px; bottom: 50%; left: 50%; transform: translate(-50%, -50%); transition: left 0.1s linear, top 0.1s linear; user-select: none; }
        .controls { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: grid; grid-template-columns: repeat(3, 60px); grid-template-rows: repeat(2, 60px); gap: 10px; z-index: 10; }
        .btn { background: rgba(255, 255, 255, 0.3); border: 2px solid white; border-radius: 10px; color: white; font-size: 24px; font-weight: bold; display: flex; justify-content: center; align-items: center; cursor: pointer; user-select: none; }
        .btn:active { background: rgba(255, 255, 255, 0.6); }
        .up { grid-column: 2; }
        .left { grid-column: 1; grid-row: 2; }
        .down { grid-column: 2; grid-row: 2; }
        .right { grid-column: 3; grid-row: 2; }
        h1 { position: absolute; top: 20px; width: 100%; text-align: center; font-size: 24px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <div id="loader">
        <div class="spinner"></div>
        <div id="percentage">0%</div>
    </div>
    <div id="game-container">
        <h1>NicolasMundo: Pinguim Remake 🐧</h1>
        <div id="ice-world">
            <div id="penguin">🐧</div>
        </div>
        <div class="controls">
            <div class="btn up" onclick="move('up')">▲</div>
            <div class="btn left" onclick="move('left')">◀</div>
            <div class="btn down" onclick="move('down')">▼</div>
            <div class="btn right" onclick="move('right')">▶</div>
        </div>
    </div>
    <script>
        const percentageEl = document.getElementById("percentage");
        const loaderEl = document.getElementById("loader");
        const gameContainer = document.getElementById("game-container");
        let count = 0;
        const counterInterval = setInterval(() => {
            count++;
            percentageEl.innerText = count + "%";
            if (count >= 100) {
                clearInterval(counterInterval);
                loaderEl.style.display = "none";
                gameContainer.style.display = "block";
            }
        }, 20);
        const pinguim = document.getElementById("penguin");
        let posX = 50;
        let posY = 50;
        function move(direction) {
            const passo = 5;
            if (direction === 'up' && posY > 15) posY -= passo;
            if (direction === 'down' && posY < 85) posY += passo;
            if (direction === 'left' && posX > 5) posX -= passo;
            if (direction === 'right' && posX < 95) posX += passo;
            pinguim.style.left = posX + "%";
            pinguim.style.top = posY + "%";
        }
    </script>
</body>
</html>
