name: Compilar Club Penguin Wii

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest

    steps:
      - name: Baixar Codigo Fonte
        uses: actions/checkout@v4

      - name: Compilar com Makefile
        run: |
          make

      - name: Guardar Jogo Compilado (boot.dol)
        uses: actions/upload-artifact@v4
        with:
          name: ClubPenguinRemake-Wii
          path: boot.dol

